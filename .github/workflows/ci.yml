name: Go Teaching Notes CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-teaching-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-course:
    name: Root course examples and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Show toolchain
        run: go version

      - name: Verify module checksum
        run: go mod verify

      - name: Test root examples and crawler
        run: go test ./... -count=1

      - name: Verify published docs entry
        run: |
          test -s docs/index.html
          test -f docs/ReleaseNote/index.html
          test -f docs/c-python-go-performance-supplement.html
          grep -E "ReleaseNote/index.html|c-python-go-performance-supplement" docs/index.html

      - name: Check operational runbook
        run: node scripts/check-operational-runbook.mjs

      - name: Check operational runbook scope contract
        run: node scripts/check-operational-runbook-scope-contract.mjs

      - name: Check Prometheus config
        run: node scripts/check-prometheus-config.mjs

      - name: Check Prometheus config contract
        run: node scripts/check-prometheus-config-contract.mjs

      - name: Check operational observability contract
        run: node scripts/check-operational-observability-contract.mjs

      - name: Check OpenAPI contract
        run: node scripts/check-openapi-contract.mjs

      - name: Check readiness contract
        run: node scripts/check-readiness-contract.mjs

      - name: Check request decoding contract
        run: node scripts/check-request-decoding-contract.mjs

      - name: Check idempotency key contract
        run: node scripts/check-idempotency-key-contract.mjs

      - name: Check API latency metrics contract
        run: node scripts/check-api-latency-metrics-contract.mjs

      - name: Check service transaction boundary contract
        run: node scripts/check-service-transaction-boundary-contract.mjs

      - name: Check panic recovery contract
        run: node scripts/check-panic-recovery-contract.mjs

      - name: Check request correlation contract
        run: node scripts/check-request-correlation-contract.mjs

      - name: Check API security contract
        run: node scripts/check-api-security-contract.mjs

      - name: Check worker failure contract
        run: node scripts/check-worker-failure-contract.mjs

      - name: Check worker shutdown contract
        run: node scripts/check-worker-shutdown-contract.mjs

      - name: Check retry cancellation contract
        run: node scripts/check-retry-cancellation-contract.mjs

      - name: Check request timeout contract
        run: node scripts/check-request-timeout-contract.mjs

      - name: Check queue backpressure contract
        run: node scripts/check-queue-backpressure-contract.mjs

      - name: Check DB pool contract
        run: node scripts/check-db-pool-contract.mjs

      - name: Check migration contract
        run: node scripts/check-migration-contract.mjs

      - name: Check pprof diagnostics contract
        run: node scripts/check-pprof-contract.mjs

      - name: Check trace shutdown contract
        run: node scripts/check-trace-shutdown-contract.mjs

      - name: Check rate limit contract
        run: node scripts/check-rate-limit-contract.mjs

      - name: Check trusted proxy contract
        run: node scripts/check-trusted-proxy-contract.mjs

      - name: Check CORS contract
        run: node scripts/check-cors-contract.mjs

      - name: Check request body limit contract
        run: node scripts/check-request-body-limit-contract.mjs

      - name: Check HTTP timeout contract
        run: node scripts/check-http-timeout-contract.mjs

      - name: Check startup config contract
        run: node scripts/check-startup-config-contract.mjs

      - name: Check shutdown signal contract
        run: node scripts/check-shutdown-signal-contract.mjs

      - name: Check CI quality gate contract
        run: node scripts/check-ci-quality-gate-contract.mjs

      - name: Check CI contract parity contract
        run: node scripts/check-ci-contract-parity-contract.mjs

      - name: Check contract gate inventory contract
        run: node scripts/check-contract-gate-inventory-contract.mjs

      - name: Check docs publishing contract
        run: node scripts/check-docs-publishing-contract.mjs

      - name: Check production workflow contract
        run: node scripts/check-production-workflow-contract.mjs

      - name: Check syntax flow SVG contract
        run: node scripts/check-syntax-flow-svg-contract.mjs

      - name: Check Go release notes contract
        run: node scripts/check-go-release-notes-contract.mjs

      - name: Check release artifact chain contract
        run: node scripts/check-release-artifact-chain-contract.mjs

      - name: Check dependency governance contract
        run: node scripts/check-dependency-governance-contract.mjs

      - name: Check performance benchmark governance contract
        run: node scripts/check-performance-benchmark-governance-contract.mjs

      - name: Check release rollback drill contract
        run: node scripts/check-release-rollback-drill-contract.mjs

      - name: Check Docker build contract
        run: node scripts/check-docker-build-contract.mjs

      - name: Check Compose smoke contract
        run: node scripts/check-compose-smoke-contract.mjs

      - name: Check Compose runtime env contract
        run: node scripts/check-compose-runtime-env-contract.mjs

      - name: Check OTLP collector contract
        run: node scripts/check-otel-collector-contract.mjs

      - name: Check OTLP export governance contract
        run: node scripts/check-otel-export-governance-contract.mjs

      - name: Check secret handling governance contract
        run: node scripts/check-secret-handling-governance-contract.mjs

      - name: Check supply chain artifact governance contract
        run: node scripts/check-supply-chain-artifact-governance-contract.mjs

      - name: Check platform promotion policy contract
        run: node scripts/check-platform-promotion-policy-contract.mjs

      - name: Check deployment controller config contract
        run: node scripts/check-deployment-controller-config-contract.mjs

  production-contract:
    name: Production API worker contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: production-api-worker/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify module checksum
        run: go mod verify

      - name: Run contract tests
        run: |
          go test ./internal/config ./internal/migration -count=1
          go test ./internal/api -run 'Test.*Contract|TestReadinessContract|TestPanicRecoveryContract|TestRequestDecodingContract|TestRequestBodyLimitContract|TestRequestTimeoutContract|TestRateLimitContract|TestCORSAllowedOriginsContract|TestIdempotencyKeyContract|TestAPILatencyMetricsContract' -count=1
          go test ./cmd/api-worker -run 'TestMonitoredSignalsContract|TestHTTPServerTimeoutContract' -count=1
          go test ./internal/observability -run 'TestTraceShutdownContract' -count=1
          go test ./internal/app -run 'TestCreateJobStopsDeadlockRetryWhenContextCanceled|TestCreateJobIdempotencyKeyContract|TestServiceTransactionBoundaryContract' -count=1
          go test ./internal/worker -run 'Test.*Shutdown|TestConcurrentEnqueueAndShutdownDoesNotPanic|TestWorkerFailureResultContract|TestQueueBackpressureContract' -count=1

      - name: Run full test suite with race detector
        run: go test -race -cover ./... -count=1

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan production-api-worker module
        working-directory: production-api-worker
        run: govulncheck ./...

  docker-build:
    name: Production Docker build and smoke
    runs-on: ubuntu-latest
    needs:
      - production-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production-api-worker image
        run: docker build -t production-api-worker:ci ./production-api-worker

      - name: Start production-api-worker compose stack
        working-directory: production-api-worker
        run: docker compose up -d --build

      - name: Smoke test production-api-worker compose stack
        working-directory: production-api-worker
        run: ./scripts/compose-smoke.sh

      - name: Dump compose logs on failure
        if: failure()
        working-directory: production-api-worker
        run: docker compose logs --no-color

      - name: Stop production-api-worker compose stack
        if: always()
        working-directory: production-api-worker
        run: docker compose down -v
