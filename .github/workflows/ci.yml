name: Go Teaching Notes CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-teaching-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-course:
    name: Root course examples and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Show toolchain
        run: go version

      - name: Verify module checksum
        run: go mod verify

      - name: Test root examples and crawler
        run: go test ./... -count=1

      - name: Verify published docs entry
        run: |
          test -s docs/index.html
          test -f docs/ReleaseNote/index.html
          test -f docs/c-python-go-performance-supplement.html
          grep -E "ReleaseNote/index.html|c-python-go-performance-supplement" docs/index.html

      - name: Check operational runbook
        run: node scripts/check-operational-runbook.mjs

  production-contract:
    name: Production API worker contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: production-api-worker/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify module checksum
        run: go mod verify

      - name: Run contract tests
        run: |
          go test ./internal/config ./internal/migration -count=1
          go test ./internal/api -run 'Test.*Contract|TestReadinessContract|TestPanicRecoveryContract|TestRequestDecodingContract|TestRequestTimeoutContract' -count=1
          go test ./internal/app -run 'TestCreateJobStopsDeadlockRetryWhenContextCanceled' -count=1
          go test ./internal/worker -run 'Test.*Shutdown|TestConcurrentEnqueueAndShutdownDoesNotPanic' -count=1

      - name: Run full test suite with race detector
        run: go test -race -cover ./... -count=1

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan production-api-worker module
        working-directory: production-api-worker
        run: govulncheck ./...

  docker-build:
    name: Production Docker build and smoke
    runs-on: ubuntu-latest
    needs:
      - production-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production-api-worker image
        run: docker build -t production-api-worker:ci ./production-api-worker

      - name: Start production-api-worker compose stack
        working-directory: production-api-worker
        run: docker compose up -d --build

      - name: Smoke test production-api-worker compose stack
        working-directory: production-api-worker
        run: ./scripts/compose-smoke.sh

      - name: Dump compose logs on failure
        if: failure()
        working-directory: production-api-worker
        run: docker compose logs --no-color

      - name: Stop production-api-worker compose stack
        if: always()
        working-directory: production-api-worker
        run: docker compose down -v
