global:
  resolve_timeout: 5m

route:
  receiver: teaching-webhook
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: teaching-webhook
    webhook_configs:
      - url: http://host.docker.internal:19093/alertmanager-webhook
        send_resolved: true

templates: []

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - alertname
      - service

# Alertmanager routing governance contract:
# - local teaching receiver: teaching-webhook
# - production receiver owner: on-call platform owner
# - escalation owner: service owner before platform owner escalation
# - silence policy: time-boxed, owner-tagged, and linked to an incident
# - notification evidence: alert delivery test, resolved notification, and postmortem link
