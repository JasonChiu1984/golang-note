openapi: 3.1.0
info:
  title: production-api-worker API
  version: v1.0.80
  description: >
    Machine-readable contract for the Go teaching production API worker.
    This file mirrors docs/api-contract.md and the Go contract tests,
    including readiness lifecycle behavior for public /livez and /readyz
    probes. Readiness lifecycle keeps /livez public with 200 while /readyz
    returns 200 when ready and 503 when draining.
    including strict request decoding, rate limit, trusted proxy client IP behavior, TRUSTED_PROXY_CIDRS,
    and CORS allowlist
    behavior controlled by CORS_ALLOWED_ORIGINS. POST /jobs request bodies are
    bounded by REQUEST_BODY_LIMIT_BYTES and return payload_too_large when they
    exceed the configured limit. Prometheus config contract gate keeps
    configs/prometheus/prometheus.yml, alert rules, Compose monitoring profile,
    API key scrape auth risk, check-prometheus-config-contract.mjs, Makefile,
    and CI entrypoints aligned. Operational observability contract gate keeps
    runbook, Prometheus scrape config, alert rules, Compose monitoring profile,
    and API key scrape auth risk aligned with CI and Makefile entrypoints.
    OTLP export governance contract gate keeps local debug exporter teaching mode,
    production Tempo, Jaeger, OTLP backend, or cloud APM ownership, sampling rate,
    retention window, sensitive attribute redaction, trace data owner, and
    check-otel-export-governance-contract.mjs aligned. Secret handling governance contract gate keeps API_KEY, PPROF_TOKEN, bearer token file, secret mount, secret rotation owner, no hard-coded production credentials, incident artifact redaction, and check-secret-handling-governance-contract.mjs aligned.
    Supply chain artifact governance contract gate keeps SBOM, image signing,
    provenance / attestation, artifact retention, promotion approval,
    release evidence owner, and check-supply-chain-artifact-governance-contract.mjs aligned.
    Platform promotion policy contract gate keeps platform promotion policy,
    environment approval, progressive rollout, platform-native signing,
    artifact verification, rollback owner, and
    check-platform-promotion-policy-contract.mjs aligned.
    Deployment controller config contract gate keeps deployment controller,
    cloud environment template, environment manifest, progressive rollout controller,
    health gate, rollback trigger, promotion evidence, and
    check-deployment-controller-config-contract.mjs aligned.
    Operational runbook scope freshness contract gate keeps runbook metadata,
    API contract scope coverage, Docs publishing contract gate, Release artifact
    chain contract gate, Secret handling governance contract gate, Supply chain
    artifact governance contract gate, and check-operational-runbook-scope-contract.mjs aligned.
    CI contract parity gate keeps make ci-contract
    and GitHub Actions production contract selectors aligned on
    TestCORSAllowedOriginsContract. The runtime server also uses explicit HTTP
    read header, read, write, idle, shutdown, and queue drain timeouts.
    Handler request timeout maps context.DeadlineExceeded to 504 request_timeout
    while preserving X-Request-ID for client retry and incident correlation.
    Request correlation uses X-Request-ID across response headers, request
    context, structured logs, and trace attribute request.id.
    API security uses optional API_KEY Bearer authentication for jobs and
    metrics while liveness and readiness probes remain public for deployment
    systems.
    Worker failure handling keeps failed jobs visible through worker_jobs_total.
    Worker shutdown contract keeps Queue.Enqueue and Queue.ShutdownContext aligned
    around the same mutex-protected closed state, ErrClosed returns, shutdown
    tests, check-worker-shutdown-contract.mjs, Makefile, docs, and CI static gates.
    Retry cancellation keeps deadlock retry backoff bound to request or shutdown context.
    Service transaction boundary contract keeps sql.TxOptions, commit-before-enqueue,
    queue-full failed status updates, check-service-transaction-boundary-contract.mjs,
    Makefile, and CI static gates aligned.
    Queue backpressure returns 503 queue_full while preserving dropped result labels,
    queue depth, and worker duration metrics. DB pool contract keeps DATABASE_MAX_OPEN_CONNS,
    DATABASE_MAX_IDLE_CONNS, DATABASE_CONN_MAX_LIFETIME, repository pool wiring,
    Makefile, and CI static gates aligned. Migration contract keeps DATABASE_URL,
    MIGRATIONS_DIR, MIGRATION_TIMEOUT, schema_migrations, transaction apply, Go tests,
    Makefile, and CI static gates aligned. Request decoding rejects malformed JSON,
    unknown fields, trailing JSON values, and blank job names with invalid_input.
    Compose smoke contract keeps docker compose up -d --build, host-side
    scripts/compose-smoke.sh, /livez, /readyz, POST /jobs, GET /jobs/{id},
    /metrics, docker compose logs --no-color, Makefile, and CI static gates aligned.
    CI quality gate contract keeps go mod verify, production contract tests,
    go test -race -cover, govulncheck ./..., Docker build, Compose smoke,
    Makefile, and CI static gates aligned.
    Startup configuration contract gate keeps PORT, QUEUE_SIZE, WORKERS,
    OTEL_EXPORTER_OTLP_ENDPOINT, config loader, Go tests, Makefile, and CI
    static gates aligned through check-startup-config-contract.mjs.
    Trace shutdown contract keeps Observability.Shutdown bounded by a 3 second
    context, keeps api-worker process exit hooked to obs.Shutdown, and keeps
    TestTraceShutdownContract, check-trace-shutdown-contract.mjs, Makefile,
    docs, and CI static gates aligned.
    Contract gate inventory keeps all 48 root contract checker scripts,
    check-contract-gate-inventory-contract.mjs, Makefile, README, API contract,
    chapters, visual course, and GitHub Actions aligned.
    Docs publishing contract gate keeps docs/index.html, GitHub Pages link fix,
    check-docs-publishing-contract.mjs, fix-docs-index-links.mjs --check,
    check-html-home-links.mjs, Makefile, and CI static gates aligned.
    API contract scope coverage keeps docs/api-contract.md header scope aligned
    with Docs publishing contract gate, release gates, OpenAPI description, and
    check-openapi-contract.mjs.
    Production workflow contract gate keeps production-api-worker/.github/workflows/production-api-worker.yml,
    make ci-contract, race coverage, govulncheck, Docker build, Compose smoke,
    failure logs, cleanup, Makefile, and CI static gates aligned.
    Syntax flow SVG contract gate keeps docs/golang-syntax-application-svg.html,
    the integrated visual-course source, check-syntax-flow-svg-contract.mjs,
    25 syntax flows, standard flowchart symbols, SVG metadata, blueprint
    renderer, Makefile, and CI static gates aligned.
    Go ReleaseNote contract gate keeps scripts/generate-go-release-notes.mjs,
    ReleaseNote/, docs/ReleaseNote/, Go 1.1-1.26 report sections,
    Go 1.26.4 and Go 1.25.11 patch signals, official source links,
    Makefile, and CI static gates aligned through check-go-release-notes-contract.mjs.
    Release artifact chain contract gate keeps review reports, update-needed
    notes, update records, VERSION, CHANGELOG.md, docs/index.html, Makefile,
    and CI static gates aligned through check-release-artifact-chain-contract.mjs.
    Dependency governance contract gate keeps go mod tidy, go mod verify,
    go list -m -u all, govulncheck ./..., root and production module scan
    coverage, offline module proxy and vulnerability database notes, Makefile,
    and CI static gates aligned through check-dependency-governance-contract.mjs.
    Performance benchmark governance contract keeps benchmark A/B,
    benchstat old.txt new.txt, pprof, metrics, raw output evidence, Makefile,
    and CI static gates aligned through check-performance-benchmark-governance-contract.mjs.
    Release rollback drill contract keeps rollback decision, previous image restore,
    migration rollback boundary, health verification, metrics verification,
    postmortem evidence, Makefile, and CI static gates aligned through
    check-release-rollback-drill-contract.mjs.
    Docker build contract keeps the Dockerfile multi-stage build, CGO_ENABLED=0,
    api-worker and migrate binaries, distroless/static-debian12 runtime image,
    docker build -t production-api-worker:ci ./production-api-worker,
    docker build -t production-api-worker:standalone ., Makefile, and CI static
    gates aligned through check-docker-build-contract.mjs.
    Compose runtime env contract keeps docker-compose.yml services, DATABASE_URL,
    OTEL_EXPORTER_OTLP_ENDPOINT, API_KEY, REQUEST_BODY_LIMIT_BYTES,
    TRUSTED_PROXY_CIDRS, CORS_ALLOWED_ORIGINS, migration dependency, monitoring
    profile, Makefile, and CI static gates aligned through
    check-compose-runtime-env-contract.mjs.
    API latency metrics contract keeps api_request_duration_seconds, route,
    method, status labels, Go contract tests, Makefile, and CI static gate aligned.
    Idempotency key contract keeps POST /jobs retry-safe through the
    Idempotency-Key header, memory/Postgres repository lookup, migration unique
    index, Go contract tests, Makefile, and CI static gate.
    Panic recovery keeps handler panics behind a stable 500 internal_error JSON
    response while preserving X-Request-ID for incident review.
servers:
  - url: http://localhost:8080
    description: Local memory or Docker Compose mode
tags:
  - name: jobs
    description: Job creation and lookup endpoints
  - name: health
    description: Public liveness and readiness endpoints
  - name: metrics
    description: Prometheus metrics endpoint
security:
  - bearerAuth: []
paths:
  /jobs:
    post:
      tags:
        - jobs
      summary: Create a job and enqueue worker processing
      operationId: createJob
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
            examples:
              resize:
                value:
                  name: resize
                  payload: image
      responses:
        "202":
          description: Job accepted and queued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/QueueFull"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}:
    get:
      tags:
        - jobs
      summary: Get a job by id
      operationId: getJob
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Job found
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /livez:
    get:
      tags:
        - health
      summary: Liveness probe
      operationId: livez
      security: []
      responses:
        "200":
          description: Process is alive
  /readyz:
    get:
      tags:
        - health
      summary: Readiness probe
      operationId: readyz
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic
        "503":
          description: Service is draining and should stop receiving new traffic
  /metrics:
    get:
      tags:
        - metrics
      summary: Prometheus metrics
      operationId: metrics
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when API_KEY is configured. Health endpoints stay public.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: Client-provided correlation id. Server echoes this value or creates req-*.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^\\S+$"
      description: Optional idempotency key. Repeating POST /jobs with the same key returns the existing job and does not enqueue another worker task.
  headers:
    RequestID:
      description: Request correlation id echoed by the server.
      schema:
        type: string
  schemas:
    JobInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Logical job name. Blank or whitespace-only values are invalid.
        payload:
          type: string
          maxLength: 4096
          description: Optional small payload for the teaching example.
    JobStatus:
      type: string
      enum:
        - pending
        - processing
        - done
        - failed
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - payload
        - status
        - attempts
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        payload:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - invalid_input
                - not_found
                - queue_full
                - request_timeout
                - payload_too_large
                - rate_limited
                - unauthorized
                - internal_error
            message:
              type: string
  responses:
    InvalidInput:
      description: Invalid request body, unknown field, trailing JSON value, or blank name.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: API_KEY is configured and Authorization bearer token is missing or invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Job id does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    QueueFull:
      description: Bounded worker queue cannot accept a new job.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Client IP exceeded RATE_LIMIT_REQUESTS_PER_MINUTE for protected job endpoints.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          description: Seconds before retrying the protected endpoint.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: POST /jobs request body exceeded REQUEST_BODY_LIMIT_BYTES.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RequestTimeout:
      description: Request context deadline exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error or panic recovery.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
