name: production-api-worker

on:
  push:
    paths:
      - "production-api-worker/**"
  pull_request:
    paths:
      - "production-api-worker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-api-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: production-api-worker/go.mod
          cache-dependency-path: production-api-worker/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify module checksum
        run: go mod verify
      - name: Run production contract tests
        run: make ci-contract
      - name: Run full test suite with race detector
        run: go test -race -cover ./... -count=1
      - name: Build api-worker binary
        run: go build ./cmd/api-worker
      - name: Build migrate binary
        run: go build ./cmd/migrate
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan production module
        run: govulncheck ./...
      - name: Build Docker image
        run: docker build -t production-api-worker:standalone .
      - name: Start Compose stack
        run: docker compose up -d --build
      - name: Smoke test Compose stack
        run: ./scripts/compose-smoke.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
